[package]
name = "mimalloc-rich-src-v2"
# matches the mimalloc version, but with major version 2 => 1 and patch version x100
# The major version will increase if we change this rust crate in a backwards-incompatible manner.
# This patch version gives us room to make up to 100 patch releases of our own
# per upstream mimalloc patch release
version = "1.5.201"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Vendored source code for mimalloc v2"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories = ["api-bindings", "development-tools::build-utils"]
# See src-v3 for why we make these particular choices
exclude = [
    "mimalloc-v2/doc",
    "mimalloc-v2/docs",
    "mimalloc-v2/contrib",
]

[features]
# unstable: Use the `git` command line to verify the version of the package
# This only affects the build script
unstable-verify-version-git = []

[dev-dependencies]
# Only used to verify the version in tests.
# Not a regular dependency, so that changes to the build code
# are never a breaking change for this crate.
mimalloc-rich-src-build.workspace = true

[lints]
workspace = true
