[workspace]
resolver = "3"
members = ["libs/*"]

[workspace.package]
# Make sure to bump vendored src crate patch versions
# whenever this crate has an imcompatible prerelease version
version = "0.1.0-alpha.1"
authors = ["Techcable <Techcable@techcable.net>"]
edition = "2024"
# 1.81 - core::error::Error, #[expect(.., reason = "...")]
# 1.85 - Rust 2024
# 1.95 - core::hint::cold_path
# 1.100 - allocator api stabilized
rust-version = "1.85"
readme = "README.md"
repository = "https://github.com/Techcable/mimalloc-rich.rs"
license = "MIT OR Apache-2.0"
keywords = ["allocator", "bindings", "mimalloc", "performance"]
categories = ["api-bindings", "memory-management", "no-std", "no-std::no-alloc"]

[workspace.dependencies]
# build tools

bindgen = "0.73"
cmake = "0.1"

# utiltiies (only used for build)

itertools = "0.15"

# workspace/path dependencies

mimalloc-rich-src-build = { path = "libs/mimalloc-rich-src-build", version = "0.1.0-alpha.1" }
mimalloc-rich-src-v2 = { path = "libs/mimalloc-rich-src-v2", version = "1" }
mimalloc-rich-src-v3 = { path = "libs/mimalloc-rich-src-v3", version = "1" }
mimalloc-rich-sys = { path = "libs/mimalloc-rich-sys", version = "0.1.0-alpha.1" }

[workspace.lints.clippy]
## groups ##

cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# restrictions group

alloc_instead_of_core = "deny"
redundant_test_prefix = "warn" # name test_foo is redundant with #[test] attr
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"

# safety

missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny" # all unsafe blocks should be documented

## aggressively lint casts ##
# in an ideal world. overflowing casts would panic
# linting them (with deny) is the second best option

cast_lossless = "allow" # lossless casts are fine, lints will catch if types change
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_ptr_alignment = "deny"
cast_sign_loss = "deny"
char_lit_as_u8 = "deny"
fn_to_numeric_cast = "deny"
fn_to_numeric_cast_any = "deny"
fn_to_numeric_cast_with_truncation = "deny"
ptr_as_ptr = "allow" # pointer casts are fine as long as they don't violate another rule

# excessively pedantic (even for clippy::pedantic)

if_not_else = "allow"
items_after_statements = "allow"
needless_continue = "allow"
# done intentionally to make sure certian code type checks
no_effect_underscore_binding = "allow"
# these can actually make things clearer
redundant_else = "allow"
single_match_else = "allow" # often cleaner
too_many_lines = "allow"

# things that might be nice to enable in the future

missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.metadata.cargo-reedme]
note = "Do not edit - automatically generated by cargo-reedme"
